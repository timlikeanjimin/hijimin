name: Build Game APK

# 웹 전용으로 전환: APK 자동 빌드는 비활성화. 필요할 때만 수동 실행(workflow_dispatch).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: game-app/package.json

      - name: Ensure node available system-wide (for Gradle)
        run: sudo ln -sf "$(which node)" /usr/bin/node && sudo ln -sf "$(which npm)" /usr/bin/npm

      - name: Install dependencies
        working-directory: game-app
        run: npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo prebuild (generate Android project)
        working-directory: game-app
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle executable
        working-directory: game-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: game-app/android
        run: |
          n=0
          until ./gradlew assembleDebug --no-daemon --stacktrace; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "Gradle build failed after $n attempts"
              exit 1
            fi
            echo "Gradle attempt $n failed (likely transient download). Retrying in 15s..."
            sleep 15
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommanderTD-debug-${{ github.run_number }}
          path: game-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
