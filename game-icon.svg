<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16224a"/>
    </linearGradient>
    <linearGradient id="tw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef0ff"/>
      <stop offset="1" stop-color="#22c3ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 사거리 링 -->
  <circle cx="256" cy="270" r="150" fill="none" stroke="#7ef0ff" stroke-opacity="0.25" stroke-width="6"/>
  <!-- 타워 본체 -->
  <rect x="196" y="250" width="120" height="120" rx="18" fill="#10193a" stroke="url(#tw)" stroke-width="10"/>
  <!-- 포신 -->
  <rect x="244" y="150" width="24" height="120" rx="12" fill="url(#tw)"/>
  <circle cx="256" cy="150" r="26" fill="#ff9d5c"/>
  <!-- 성가퀴(기지) -->
  <g fill="url(#tw)">
    <rect x="196" y="236" width="22" height="22"/>
    <rect x="245" y="236" width="22" height="22"/>
    <rect x="294" y="236" width="22" height="22"/>
  </g>
</svg>
