name: Deploy UNSUB Push Worker

on:
  push:
    branches: [main]
    paths:
      - 'unsub-push-worker.js'
      - 'wrangler-push.toml'
      - '.github/workflows/deploy-push-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@3.90.0

      - name: Sanitize API token
        run: |
          # Extract the token even if the secret contains extra whitespace,
          # newlines, or a pasted curl command around it
          CLEAN=$(printf '%s' "${{ secrets.CLOUDFLARE_API_TOKEN }}" | grep -oE '[A-Za-z0-9_-]{40,}' | head -1)
          if [ -z "$CLEAN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret does not contain a valid token"
            exit 1
          fi
          echo "::add-mask::$CLEAN"
          echo "CLOUDFLARE_API_TOKEN=$CLEAN" >> "$GITHUB_ENV"

      - name: Ensure KV namespace exists and patch config
        run: |
          set -e
          LIST=$(wrangler kv namespace list 2>/dev/null || echo '[]')
          ID=$(echo "$LIST" | node -e "
            let d='';
            process.stdin.on('data', c => d += c).on('end', () => {
              try {
                const arr = JSON.parse(d);
                const ns = arr.find(x => x.title && x.title.includes('PUSH_KV'));
                console.log(ns ? ns.id : '');
              } catch (e) { console.log(''); }
            });
          ")
          if [ -z "$ID" ]; then
            echo "Creating KV namespace PUSH_KV..."
            OUT=$(wrangler kv namespace create PUSH_KV --config wrangler-push.toml 2>&1) || true
            echo "$OUT"
            ID=$(echo "$OUT" | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ID" ]; then
            echo "::error::Failed to find or create KV namespace"
            exit 1
          fi
          echo "Using KV namespace ID: $ID"
          sed -i "s/REPLACE_WITH_YOUR_KV_NAMESPACE_ID/$ID/" wrangler-push.toml
          cat wrangler-push.toml

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy --config wrangler-push.toml
