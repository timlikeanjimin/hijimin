<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .theme-toggle {
            position: fixed !important;
            top: 20px !important;
            right: 20px !important;
            width: 40px !important;
            height: 40px !important;
            z-index: 9999 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 !important;
            cursor: pointer !important;
            border-radius: 50% !important;
            background: white !important;
            border: 1px solid #ccc !important;
        }
        .theme-toggle svg {
            width: 20px !important;
            height: 20px !important;
            display: block !important;
        }
        .sun-icon { display: none !important; }
        .moon-icon { display: block !important; }
        body[data-theme="dark"] .sun-icon { display: block !important; }
        body[data-theme="dark"] .moon-icon { display: none !important; }
        body[data-theme="dark"] .theme-toggle { background: #333 !important; border-color: #555 !important; }
    </style>
</head>

            <span class="button-text">Generate Numbers</span>
        </button>
    </div>
    <script src="main.js?v=2"></script>

</html>
