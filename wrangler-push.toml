name = "unsub-push"
main = "unsub-push-worker.js"
compatibility_date = "2024-01-01"

# Cron trigger — 00:00 UTC = 09:00 KST (Korean Standard Time)
[triggers]
crons = ["0 0 * * *"]

# KV namespace for storing push subscriptions
# 👇 Cloudflare 대시보드에서 KV 네임스페이스 만든 후 ID를 여기에 넣으세요
[[kv_namespaces]]
binding = "PUSH_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
