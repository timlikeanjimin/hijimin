<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <!-- Theme toggle SVG icons will be here -->
    </button>
    <div class="main-wrapper">
        <!-- Lotto Number Generator -->
        <div class="container">
            <h1>Lotto Number Generator</h1>
            <p class="subtitle">Generate your lucky numbers based on 100-draw statistics!</p>
            <div class="lotto-numbers"></div>
            <button id="generate-btn">
                <span class="button-text">Generate Smart Numbers</span>
            </button>
        </div>

        <!-- Lotto Number Statistics -->
        <div class="container stats-container">
            <h2>로또 번호 통계</h2>
            <p class="subtitle">최근 100회차의 당첨 번호를 기반으로 분석한 결과입니다.</p>
            <div class="stats-box">
                <h3>Most Frequent Numbers (Hot)</h3>
                <div id="hot-numbers" class="stats-list"></div>
            </div>
            <div class="stats-box">
                <h3>Least Frequent Numbers (Cold)</h3>
                <div id="cold-numbers" class="stats-list"></div>
            </div>
        </div>

        <!-- Partnership Inquiry -->
        <div class="container partnership-container">
            <h2>Partnership Inquiry</h2>
            <p class="subtitle">Contact us for collaboration opportunities.</p>
            <form action="https://formspree.io/f/xkoezowa" method="POST" class="partnership-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="_replyto" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Inquiry</button>
            </form>
        </div>

        <!-- Disqus Comments -->
        <div class="container comments-container">
            <h2>Comments</h2>
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://hijimin.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>
    <script src="main.js?v=4"></script>
</body>
</html>
