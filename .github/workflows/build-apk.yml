name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'unsub-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: unsub-app/package.json

      - name: Install dependencies
        working-directory: unsub-app
        run: npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo prebuild (generate Android project)
        working-directory: unsub-app
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle executable
        working-directory: unsub-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: unsub-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNSUB-debug-${{ github.run_number }}
          path: unsub-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
